<dialog id="host-modal" class="overlay-modal" aria-labelledby="host-title">
  <form class="modal-box" method="dialog">
    <h2 id="host-title">Als Gastgeber anmelden</h2>
    <div id="host-info">
      <p>Gib das Passwort ein, um als Gastgeber durch den Abend zu führen.</p>
    </div>
    <label for="host-pw">Passwort</label>
    <input type="password" id="host-pw" autocomplete="off" autofocus>
    <div class="modal-buttons">
      <button type="button" id="host-cancel">Abbrechen</button>
      <button id="host-confirm">Weiter</button>
    </div>
  </form>
</dialog>
