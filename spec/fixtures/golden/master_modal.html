<dialog id="master-modal" class="overlay-modal" aria-labelledby="master-title">
  <form class="modal-box" method="dialog">
    <h2 id="master-title">Live-Scrollen starten</h2>
    <div id="master-info">
      <p>Gib das Passwort ein, um das Live-Scrollen zu leiten.</p>
    </div>
    <label for="master-pw">Passwort</label>
    <input type="password" id="master-pw" autocomplete="off" autofocus>
    <div class="modal-buttons">
      <button type="button" id="master-cancel">Abbrechen</button>
      <button id="master-confirm">Weiter</button>
    </div>
  </form>
</dialog>
