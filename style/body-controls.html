<div id="top-left-controls" class="controls-group">
  <a href="#/1" id="go-to-toc" class="ctrl"><span aria-hidden="true">📖</span> <span class="visually-hidden">Table of contents</span></a>
  <button id="toggle-chords-visibility" class="ctrl" aria-pressed="false"><span aria-hidden="true">🎹</span> <span class="visually-hidden">Hide chords</span></button>
</div>
<div id="top-right-controls" class="controls-group">
  <button id="show-qr" class="ctrl" aria-haspopup="dialog"><span aria-hidden="true">🔗</span> <span class="visually-hidden">Show QR code</span></button>
  <button id="toggle-follow" class="ctrl" aria-pressed="false" hidden><span aria-hidden="true">👣</span> <span class="visually-hidden">Browse freely</span></button>
  <button id="master-mode" class="ctrl" aria-pressed="false"><span aria-hidden="true">🚀</span> <span class="visually-hidden">Lead slide navigation</span></button>
  <button id="toggle-theme" class="ctrl" aria-pressed="false"><span aria-hidden="true" id="toggle-theme-icon">🌞</span> <span class="visually-hidden" id="toggle-theme-label">Switch to bright mode</span></button>
</div>
<script>
  document.getElementById('toggle-chords-visibility').addEventListener('click', function() {
    document.body.classList.toggle('chords-hidden');
    this.setAttribute('aria-pressed', document.body.classList.contains('chords-hidden'));
  });

  // Space on a focused button presses it, and Reveal must not turn the page
  // as well. Except where a mouse click put the focus there: nobody sees it
  // (no focus ring), so Space turns the page. Read when the focus arrives,
  // because Chrome shows the ring as soon as any key is pressed.
  var unseenFocus = null;
  document.addEventListener('focusin', function(e) {
    unseenFocus = e.target.matches(':focus-visible') ? null : e.target;
  });

  window.addEventListener('load', function() {
    Reveal.configure({
      keyboardCondition: function(event) {
        var el = document.activeElement;
        if (event.key !== ' ' || !el || !el.matches('button')) return true;
        if (el !== unseenFocus) return false;
        el.blur();
        return true;
      }
    });
  });

  (function() {
    function applyTheme(bright) {
      document.body.classList.toggle('theme-bright', bright);
      var icon  = document.getElementById('toggle-theme-icon');
      var label = document.getElementById('toggle-theme-label');
      var btn   = document.getElementById('toggle-theme');
      if (icon)  icon.textContent  = bright ? '🌛' : '🌞';
      if (label) label.textContent = bright ? 'Switch to dark mode' : 'Switch to bright mode';
      if (btn)   btn.setAttribute('aria-pressed', bright ? 'true' : 'false');
    }

    applyTheme(localStorage.getItem('theme') === 'bright');

    document.getElementById('toggle-theme').addEventListener('click', function() {
      var bright = !document.body.classList.contains('theme-bright');
      applyTheme(bright);
      localStorage.setItem('theme', bright ? 'bright' : 'dark');
    });
  })();
</script>

<dialog id="master-modal" class="overlay-modal" aria-labelledby="master-title">
  <form class="modal-box" method="dialog">
    <h2 id="master-title">Navigation übernehmen?</h2>
    <div id="master-info">
      <p>Alle anderen werden dir folgen.</p>
    </div>
    <label for="master-pw">Passwort</label>
    <input type="password" id="master-pw" autocomplete="off" autofocus>
    <div class="modal-buttons">
      <button type="button" id="master-cancel">Cancel</button>
      <button id="master-confirm">OK</button>
    </div>
  </form>
</dialog>

<dialog id="qr-modal" class="overlay-modal" aria-labelledby="qr-title">
  <div class="modal-box">
    <h2 id="qr-title" tabindex="-1" autofocus>Song Book öffnen</h2>
    <p id="qr-info">Scanne den Code, um die Liedtexte auf deinem Gerät mitzuverfolgen.</p>
    <div id="qr-canvas"></div>
    <button id="qr-close">Schliessen</button>
  </div>
</dialog>

<script>
window.addEventListener('load', function() {
  var cfg = window.MULTIPLEX;
  if (!cfg || !window.io) return;

  // The master repeats its state this often, so whoever joins late or comes
  // back from a dead spot catches up without waiting for the next slide change.
  // cfg.heartbeat lets the specs shorten it.
  var HEARTBEAT_MS = 2000;

  // One master leads: whoever took over last. Every message carries the time
  // its sender took over (its claim). A master that hears a higher claim steps
  // down; a client ignores a lower one while the leader is still sending. This
  // long without a word, the leader counts as gone: a tab that has been in the
  // background for a while is woken only once a minute.
  var LEADER_SILENCE_MS = 65000;

  var isMaster = false;
  var claim = 0;                                         // this tab's, while it is master
  var senderId = Math.random().toString(36).slice(2, 8); // per page load: settles a tie between duplicated tabs
  var leader = { claim: 0, heardAt: 0 };                 // the master this client listens to
  var heartbeat = null;
  var lastState = null;       // the master's, as last received
  var applyingRemote = false; // set while Reveal moves because the master did
  var socket = io(cfg.url);

  var followBtn = document.getElementById('toggle-follow');
  followBtn.hidden = false;

  function sameState(a, b) {
    return a.indexh === b.indexh && a.indexv === b.indexv && a.indexf === b.indexf &&
      !!a.overview === !!b.overview && !!a.paused === !!b.paused;
  }

  function follow(state) {
    if (sameState(state, Reveal.getState())) return; // a repeat changes nothing
    applyingRemote = true;
    try { Reveal.setState(state); } finally { applyingRemote = false; }
  }

  // Following is each client's own choice, remembered per tab so that a
  // reload (or iOS discarding the tab) keeps it.
  var following = true;
  try { following = sessionStorage.getItem('multiplex-free') !== '1'; } catch (e) {}

  function setFollowing(on) {
    following = on;
    document.body.classList.toggle('multiplex-free', !on);
    followBtn.setAttribute('aria-pressed', on ? 'false' : 'true');
    try { sessionStorage.setItem('multiplex-free', on ? '0' : '1'); } catch (e) {}
    if (on && lastState) follow(lastState);
  }
  setFollowing(following);

  followBtn.addEventListener('click', function() {
    setFollowing(!following);
  });

  // Paging on one's own device means browsing freely from then on: otherwise
  // the next repeat would snap the page back. 👣 brings it back to the master.
  ['slidechanged', 'fragmentshown', 'fragmenthidden', 'overviewshown', 'overviewhidden'].forEach(function(ev) {
    Reveal.on(ev, function() {
      if (!isMaster && following && !applyingRemote) setFollowing(false);
    });
  });

  socket.on(cfg.socketId, function(data) {
    if (!data || !data.state) return;
    var theirClaim = data.claim || 0;

    if (isMaster) {
      // The same claim is a duplicated tab: the higher sender id stays.
      var outranked = theirClaim > claim || (theirClaim === claim && data.from > senderId);
      if (!outranked) return;
      becomeClient(); // someone took over after this tab
    }

    // An equal claim is the leader itself, reloaded under a new sender id.
    var leaderGone = Date.now() - leader.heardAt > LEADER_SILENCE_MS;
    if (theirClaim < leader.claim && !leaderGone) return; // an older master, about to step down
    leader = { claim: theirClaim, heardAt: Date.now() };

    lastState = data.state;
    if (following) follow(lastState);
  });

  function broadcast() {
    // Not while disconnected: socket.io would queue every repeat and replay
    // them all at once. 'connect' sends the current state instead.
    if (!socket.connected) return;
    socket.emit('multiplex-statechanged', {
      secret: cfg.secret,
      socketId: cfg.socketId,
      state: Reveal.getState(),
      claim: claim,
      from: senderId
    });
  }

  socket.on('connect', function() { if (isMaster) broadcast(); });

  var REVEAL_EVENTS = ['slidechanged', 'fragmentshown', 'fragmenthidden', 'overviewshown', 'overviewhidden', 'paused', 'resumed'];

  // The role is kept per tab, with its claim, so that a master that reloads
  // (or whose tab iOS discarded) leads again without the password.
  function becomeMaster(restoredClaim) {
    // Above every claim heard, even one from a device whose clock runs ahead.
    claim = restoredClaim || Math.max(Date.now(), leader.claim + 1);
    try { sessionStorage.setItem('multiplex-master', String(claim)); } catch (e) {}
    isMaster = true;
    masterBtn.classList.add('is-master');
    masterBtn.setAttribute('aria-pressed', 'true');
    REVEAL_EVENTS.forEach(function(ev) { Reveal.on(ev, broadcast); });
    broadcast();
    heartbeat = setInterval(broadcast, cfg.heartbeat || HEARTBEAT_MS);
    followBtn.hidden = true;
  }

  function becomeClient() {
    try { sessionStorage.removeItem('multiplex-master'); } catch (e) {}
    isMaster = false;
    masterBtn.classList.remove('is-master');
    masterBtn.setAttribute('aria-pressed', 'false');
    REVEAL_EVENTS.forEach(function(ev) { Reveal.off(ev, broadcast); });
    clearInterval(heartbeat);
    followBtn.hidden = false;
  }

  var masterBtn    = document.getElementById('master-mode');
  var masterModal  = document.getElementById('master-modal');
  var masterPw     = document.getElementById('master-pw');
  var qrModal      = document.getElementById('qr-modal');

  masterBtn.addEventListener('click', function() {
    if (isMaster) { becomeClient(); return; }
    masterModal.showModal();
  });

  document.getElementById('master-cancel').addEventListener('click', function() {
    masterModal.close();
  });

  // OK and Enter submit; method="dialog" closes the dialog unless we stop it
  masterModal.querySelector('form').addEventListener('submit', function(e) {
    if (masterPw.value === cfg.password) { becomeMaster(); return; }
    e.preventDefault();
    masterPw.classList.add('shake');
    setTimeout(function() { masterPw.classList.remove('shake'); }, 500);
    masterPw.value = '';
    masterPw.focus();
  });

  masterModal.addEventListener('close', function() { masterPw.value = ''; });

  var storedClaim = 0;
  try { storedClaim = Number(sessionStorage.getItem('multiplex-master')) || 0; } catch (e) {}
  if (storedClaim) becomeMaster(storedClaim);

  var showQrBtn = document.getElementById('show-qr');

  showQrBtn.addEventListener('click', function() {
    if (!window.QRCode) return;
    var url = window.location.href.split('#')[0];
    var container = document.getElementById('qr-canvas');
    container.innerHTML = '';
    new QRCode(container, { text: url, width: 400, height: 400, colorDark: '#000000', colorLight: '#ffffff' });
    // qrcodejs draws a canvas and an image of it (a table where there is no
    // canvas), and names neither
    var img = container.querySelector('img'), canvas = container.querySelector('canvas');
    if (img) img.alt = 'QR-Code für ' + url;
    if (canvas) canvas.setAttribute('aria-hidden', 'true');
    qrModal.showModal();
  });

  document.getElementById('qr-close').addEventListener('click', function() { qrModal.close(); });

  // showModal() makes the page behind inert and Esc closes natively. What is
  // left: Reveal listens for keys on the document, where they still arrive from
  // inside the dialog, and a click on the backdrop lands on the dialog itself.
  [masterModal, qrModal].forEach(function(dialog) {
    dialog.addEventListener('keydown', function(e) { e.stopPropagation(); });
    dialog.addEventListener('keypress', function(e) { e.stopPropagation(); });
    dialog.addEventListener('click', function(e) { if (e.target === dialog) dialog.close(); });
  });
});
</script>
