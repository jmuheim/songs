name: Tests

# Runs the whole RSpec suite on every pull request, and on every push to
# master (merges, and the odd direct push — master has no branch protection).
# push is deliberately not left unscoped: a branch with an open PR fires both
# push and pull_request on every commit, running the identical suite twice.
# pull_request alone covers feature branches; master still needs its own push
# trigger since the deploy job's `needs: rspec` depends on an rspec run having
# happened in that same push-triggered workflow (a merge doesn't re-fire
# pull_request — only opened/synchronize/reopened do, not closed).
on:
  push:
    branches: [master]
  pull_request:

# A superseded run of the same branch is cancelled — except on master, where
# every commit stays verified (the deploy, added later, hangs off a green run
# there).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  rspec:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      # Matches the local Ruby (3.2). bundler-cache runs `bundle install` and
      # caches the gems; the lockfile carries x86_64-linux next to
      # arm64-darwin so the Linux runner resolves nokogiri's native gem.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      # Pinned: the golden-HTML specs compare Pandoc's exact output, so CI must
      # run the same version the committed golden fixtures were built with
      # (3.9.0.2). Installed as the official .deb.
      - name: Install Pandoc 3.9.0.2
        run: |
          wget -q https://github.com/jgm/pandoc/releases/download/3.9.0.2/pandoc-3.9.0.2-1-amd64.deb
          sudo dpkg -i pandoc-3.9.0.2-1-amd64.deb

      # The browser specs spawn the reveal-multiplex package (multiplex-server/)
      # on 127.0.0.1, so they never touch the public Railway server. Node is
      # preinstalled on ubuntu runners, and so is the Chrome that Cuprite drives.
      - name: Install multiplex-server dependencies
        run: npm ci --prefix multiplex-server

      - name: Run RSpec
        run: bundle exec rspec

  # Deploy to songs.josh.ch — only on a push to master, and only after the
  # suite is green (needs: rspec, so a red run blocks the deploy). This replaces
  # the old `./dev` loop that pushed every intermediate save live, untested.
  # `./build --deploy` stays as the manual fallback.
  deploy:
    needs: rspec
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # Its own group, never cancelled mid-flight, so two master pushes deploy one
    # after the other instead of racing onto the server.
    concurrency:
      group: deploy-songs-josh-ch
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Pandoc 3.9.0.2
        run: |
          wget -q https://github.com/jgm/pandoc/releases/download/3.9.0.2/pandoc-3.9.0.2-1-amd64.deb
          sudo dpkg -i pandoc-3.9.0.2-1-amd64.deb

      # A fresh multiplex pair per deploy, passed in the environment — build
      # reads it from there and never touches the network (the relay only checks
      # sha256(secret) == socketId).
      - name: Generate multiplex credentials
        run: |
          SECRET=$(openssl rand -hex 16)
          echo "MULTIPLEX_SOCKET_ID=$(printf '%s' "$SECRET" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "MULTIPLEX_SECRET=$SECRET" >> "$GITHUB_ENV"

      # `bundle exec`, not bare `./build`: bundler-cache above installs the gems
      # into vendor/bundle, which is only on the load path under bundler — a bare
      # `./build` fails with `cannot load such file -- nokogiri`.
      - name: Build
        run: bundle exec ./build

      # The deploy key is locked on the server (authorized_keys
      # command="…/rrsync …/songs.josh.ch") to rsync into that one directory, so
      # the rsync target is relative to it. The host key is pinned — no
      # StrictHostKeyChecking=no; refresh with `ssh-keyscan greip.uberspace.de`
      # if the server's key ever changes.
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo 'greip.uberspace.de ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILVWUx1FFTYp58W/y/dMjzj6OVcUqhMZGCWs5weJ5hSy' > ~/.ssh/known_hosts
          echo 'greip.uberspace.de ssh-rsa ' >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Same rsync as `./build --deploy` does by hand (index.html + style/ +
      # .htaccess, with --delete), but the destination path is relative:
      # rrsync chdirs into the locked directory, so the `.` target resolves
      # to songs.josh.ch itself. print.html is intentionally not deployed.
      - name: Deploy to songs.josh.ch
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes" \
            index.html style .htaccess \
            maroni@greip.uberspace.de:.
